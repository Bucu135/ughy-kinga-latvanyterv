# Ughy Kinga · Nail Trainer — statikus oldal, nincs build-lépés
[build]
  publish = "."

# A látványterv még nem publikus: ne indexelje a Google
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# A képek nem változnak, hosszú gyorsítótár
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# A stílus és a szkriptek viszont igen — ezeket mindig ellenőrizze
[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
